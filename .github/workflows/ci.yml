name: CI

on:
  push:
    branches: [ main, master ]
    tags: ['*']
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip --version
          # Retry pip install up to 3 times with increasing backoff to mitigate transient network/build issues
          for i in 1 2 3; do
            pip install -r free-games-api/requirements.txt -v && break || echo "pip install failed (attempt $i)" && sleep $((i * 5))
          done

      - name: Run tests
        working-directory: free-games-api
        run: |
          python -m pytest -q
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ./free-games-api
          file: ./free-games-api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/freegames:latest
            ghcr.io/${{ github.repository_owner }}/freegames:${{ github.sha }}
      - name: Optionally push to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v4
        with:
          context: ./free-games-api
          file: ./free-games-api/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/freegames:latest
            ${{ env.DOCKERHUB_USERNAME }}/freegames:${{ github.sha }}

  release:
  auto-release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create draft release from RELEASE_NOTES.md
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const notesPath = 'free-games-api/RELEASE_NOTES.md';
            if (!fs.existsSync(notesPath)) {
              core.setFailed(`Release notes not found at ${notesPath}`);
              return;
            }
            const body = fs.readFileSync(notesPath, 'utf8');
            const tag = process.env.GITHUB_REF.replace('refs/tags/','');
            const resp = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: body,
              draft: true,
              prerelease: false,
            });
            core.info(`Created release: ${resp.data.html_url}`);
